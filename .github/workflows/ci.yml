name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint / typecheck / test / build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 开发工具链（pnpm 11 / vitest 5 / jsdom 30 / eslint 10）最低要求 Node 22.13；
        # package.json 的 engines.node >= 18 描述的是发布产物的消费者环境。
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        # 版本取自 package.json 的 packageManager 字段

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # 根 tsconfig 只 include packages/*/src；apps/docs 与四个 playground 各有自己的 typecheck，
      # 不在此显式跑就没人跑（v1.15 该盲区已致两起文档站编译/运行错误）。
      # 干净环境实测可过：docs 的 tsc 在 .next/ 与 next-env.d.ts 均不存在时仍 exit 0
      #（next 类型经 next 包自身 d.ts 解析，不依赖构建产物）。
      # playground-nuxt 的 typecheck 内含 `pnpm -w run build && nuxt prepare`，依赖上一步的根 build。
      - name: Typecheck docs & playgrounds
        run: |
          pnpm -C apps/docs typecheck
          pnpm -C playgrounds/react typecheck
          pnpm -C playgrounds/vue typecheck
          pnpm -C playgrounds/next typecheck
          pnpm -C playgrounds/nuxt typecheck
