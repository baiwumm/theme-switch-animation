name: Release

# 发布流水线（v0.2.0 起，tag 触发）：changesets 只负责生成版本号与 CHANGELOG，发包由本 workflow 完成。
#
# 一次性前置（缺任一都会在这条链上失败）：
#   1. npmjs.com → 包页 → Settings → Trusted Publisher → 登记仓库 baiwumm/theme-switch-animation
#      + workflow 文件名 release.yml（OIDC 免密发布，仓库不需要任何 secret；
#      npm 已宣布 2027-01 起 granular token 不能再直接发包，迟早要迁）
#   2. 本文件必须先合进 main 再打 tag——workflow 取自 tag 指向的那个 commit，
#      在旧提交上打 v* tag 不会触发任何东西（且没有报错）
#
# 日常发布（全部本地，之后交给 CI）：
#   pnpm changeset version          # 消费 .changeset/*.md，写 package.json version 与 CHANGELOG
#   git add -A && git commit -m "chore(release): version 0.x.x"
#   git push
#   git tag v0.x.x && git push origin v0.x.x   # tag 一推即触发，全自动发包
#
# 为什么不用 `changeset publish`：装在仓库里的 @changesets/cli@3.0.2 全树没有 provenance 支持
# （publish 参数只有 --otp / --tag / --from-pack-dir / --git-tag），走不了 OIDC，
# 所以发布这一步换成 `npm publish --provenance`。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # npm provenance（OIDC）

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify & Publish
    runs-on: ubuntu-latest
    # 不绑 GitHub Environment（与 vue3-okr-tree 对齐）：Trusted Publishing 走 OIDC、
    # 本文件没有任何 secret，tag 推上去全自动发包，不经人工审批
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # 下面要判 tag 是否落在 main 上，需要 origin/main 可达
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        # 版本取自 package.json 的 packageManager 字段

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --frozen-lockfile

      # Trusted Publishing 要求 npm ≥ 11.5.1；setup-node 的 Node 22 自带 npm 10.x
      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@^11.5.1

      - name: Verify tag matches version and sits on main
        run: |
          node -e "const p=require('./package.json');const t=process.env.GITHUB_REF_NAME.slice(1);if(p.version!==t){console.error('package.json version '+p.version+' != tag '+t);process.exit(1)}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "tag 不在 origin/main 上，拒绝发布（避免把没进主干的代码发出去）"; exit 1; }

      # 还有未消费的 changeset 说明 `changeset version` 没跑，CHANGELOG 会缺本次叙事
      - name: Verify no unreleased changesets left
        run: |
          left=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          if [ "$left" -ne 0 ]; then
            echo "存在未消费的 changeset（先跑 pnpm changeset version 再打 tag）："
            find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md'
            exit 1
          fi

      - name: Lint / Typecheck / Test
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build & verify package contents
        run: |
          pnpm build
          pnpm verify:package

      # 手动首发过的版本再推 tag 时跳过发布而不是撞 EPUBLISHCONFLICT——
      # 后面的 gh release create 仍能把 GitHub Release 补上。
      # npm view 查不存在的版本以非零码退出，误判方向安全：只会照常尝试发布并大声报错。
      - name: Check whether this version is already on npm
        id: npm_published
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$NAME@$VERSION 已存在于 npm，跳过 publish"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (Trusted Publishing, no token)
        if: steps.npm_published.outputs.exists == 'false'
        run: npm publish --provenance --access public

      # Release 正文取 CHANGELOG 里本版本的那一段（含破坏性说明与迁移写法）。
      # 不用 --generate-notes：它靠合并的 PR 列表生成摘要，本仓库直推 main 无 PR，
      # 结果只剩一行 compare 链接（0.2.0 首发时实测过）。取不到段落时退回自动生成，不让发布链路变红。
      - name: Build release notes from CHANGELOG
        id: notes
        run: |
          node -e '
            const fs = require("node:fs");
            const v = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            const start = lines.findIndex((l) => l.trim() === "## " + v);
            let body = "";
            if (start >= 0) {
              let end = lines.length;
              for (let i = start + 1; i < lines.length; i += 1) {
                if (/^##\s/.test(lines[i])) { end = i; break; }
              }
              body = lines.slice(start, end).join("\n").trim();
            }
            if (body) {
              fs.writeFileSync("/tmp/release-notes.md", body + "\n");
              console.log("Release 正文取 CHANGELOG 的 " + v + " 段（" + body.split("\n").length + " 行）");
            } else {
              console.log("::notice::CHANGELOG 没有 " + v + " 段，退回 --generate-notes");
            }
          '
          if [ -s /tmp/release-notes.md ]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        run: |
          if [ "${{ steps.notes.outputs.has_notes }}" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file /tmp/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
