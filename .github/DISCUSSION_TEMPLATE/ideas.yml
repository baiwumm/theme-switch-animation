title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? Describe the problem first, then the proposal — that makes it much easier to discuss.

        动画类型扩展当前处于冻结状态（`docs/animation-roadmap.md` §1 约束 4），新类型想法仍欢迎提出，
        它是需求方重启评估的输入；发帖前请先过一遍 §4 的「明确不做」清单。
  - type: dropdown
    id: area
    attributes:
      label: 想法属于哪块
      options:
        - 新动画类型
        - reverse 接入面（更多类型）
        - 既有类型的参数化
        - 文档站与开发体验
        - 降级与无障碍
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题
      description: 你今天遇到的具体场景，以及还有谁会受益。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提议的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 尤其是既有类型 + 现有参数能不能表达同一个观感。
  - type: textarea
    id: context
    attributes:
      label: 补充上下文
      description: 参考实现、录屏、相关讨论。
  - type: checkboxes
    id: checks
    attributes:
      label: 发帖前确认
      options:
        - label: 我检索过已有讨论与文档站。
          required: true
        - label: 我读过 `docs/animation-roadmap.md` §4 的不做清单与 §1 四条约束，本想法不在其中（或在清单里但我有新证据）。
          required: true
        - label: 这是一条想法，不是打包在一起的几条。
          required: true
