packages:
  # 根目录 = 发布包 theme-switch-animation 本体，必须入 workspace 清单，
  # 否则 changesets 报 "package theme-switch-animation which is not in the workspace"，
  # changeset version / publish 无法作用于根包（Phase 6 发现的 Phase 0 遗留问题）。
  - .
  - packages/*
  - playgrounds/*
  - apps/*

# pnpm 10+ 默认不执行依赖的 build 脚本，需要 postinstall 的包在此显式放行。
allowBuilds:
  esbuild: true
  # Next 16 的图像处理依赖（apps/docs 引入；站点 images.unoptimized 但 Next 仍会装它）
  sharp: true

minimumReleaseAgeExclude:
  - vite@8.3.0

# Dependabot 安全告警的强制修复：上游钉死旧范围、semver 内无法自然升到修复版，
# 只能 override 跨 major。若上游（@eslint/config-array / js-beautify）未来放开范围，
# 应删掉对应条目回归自然解析。
# - minimatch@~10.2.4（@eslint/config-array 等）：>= 10.0.0 < 11.0.1 有 globparts DoS，
#   修复版 11.0.1；只匹配 10.x 请求，不动更老的 minimatch。
# - glob@^13.0.6（js-beautify）：>= 9.0.0 <= 14.0.1 有 AbortSignal 取消绕过，
#   修复版 14.0.2；只匹配 13.x 请求，不动 glob@2/3/4 这类老包。
overrides:
  'minimatch@10': ^11.0.1
  'glob@13': ^14.0.2

# chokidar@4.0.3（2024-12 发布，tsup 的依赖）未附带 provenance 而更早的 4.0.1 有，
# 会触发 pnpm `trustPolicy: no-downgrade` 的 ERR_PNPM_TRUST_DOWNGRADE。
# 该版本发布已久且被广泛使用，按 pnpm 官方文档示例精确排除这一个版本，信任检查对其他包继续生效。
# semver@6.3.1（2023-07 发布，nuxt 3 的依赖）同理：semver 自 7.5.1（2024）起才携带 provenance，
# 6.x 全线无证明属早期发布的正常情况（6.3.1 为 npm 生态被依赖最广的版本之一），精确排除这一个版本。
trustPolicyExclude:
  - 'chokidar@4.0.3'
  - 'semver@6.3.1'
